<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="./images/musik-modified.png">
<title>Musik - Song Upload</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    @import url('./CSS/theme.css');
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Poppins',sans-serif;
    }
    ::-webkit-scrollbar{
        display: none;
    }
    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:40px;
        background: var(--bg-0);
        overflow-x:hidden;
        position:relative;
    }

    /* Background Glow */

    body::before,
    body::after{
        content:"";
        position:fixed;
        width:450px;
        height:450px;
        border-radius:50%;
        filter:blur(120px);
        z-index:-1;
    }

    body::before{
        top:-120px;
        left:-120px;
        background: var(--accent-gold-dim);
        opacity:.45;
    }

    body::after{
        bottom:-120px;
        right:-120px;
        background: var(--accent-gold);
        opacity:.35;
    }

    /* Card */

    .form-box{

        width:100%;
        max-width:680px;

        padding:35px;

        background: var(--bg-1);

        border:1px solid  var(--border-soft);

        border-radius:24px;

        box-shadow:
        0 0 0 1px var(--overlay-scrim),
        0 25px 60px var(--shadow-color);

    }

    .form-box h2{

        color: var(--text-hi);

        text-align:center;

        margin-bottom:30px;

        font-size:30px;

        font-weight:700;

        letter-spacing:1px;

    }

    /* Inputs */

    .input-group{

        margin-bottom:22px;

    }

    .input-group label{

        color:var(--text-lo);

        display:block;

        margin-bottom:10px;

        font-size:14px;

    }

    input[type=text]{

        width:100%;

        padding:15px 18px;

        border-radius:14px;

        border:1px solid var(--border-soft);

        background: var(--bg-2);

        color:var(--text-faint);

        font-size:15px;

        transition:.3s;

    }

    input[type=text]::placeholder{

        color:var(--text-faint);

    }

    input[type=text]:focus{

        outline:none;

        border-color: var(--accent-gold);

        box-shadow:0 0 20px var(--accent-gold-soft);

    }

    /* Upload Box */

    .file-box{

        display:block;

        border:2px dashed var(--border-soft);

        border-radius:18px;

        padding:28px;

        text-align:center;

        cursor:pointer;

        background: var(--bg-2);

        color: var(--text-faint);

        transition:.35s;

    }

    .file-box:hover{

        border-color: var(--overlay-scrim);

        background: var(--bg-3);

        box-shadow:0 0 25px var(--shadow-color);

    }

    input[type=file]{

        display:none;

    }

    /* Preview */

    .preview-img{

        display:none;

        width:180px;

        height:180px;

        object-fit:cover;

        margin:20px auto 0;

        border-radius: var(--radius-sm);

        border:3px solid  var(--border-soft);

        box-shadow:0 0 25px var(--shadow-color);

    }

    #audioPreview{

        display:none;

        margin-top:18px;

        width:100%;

        border-radius:12px;

        filter:invert(.92);

    }

    /* Button */

    button{

        width:100%;

        padding:16px;

        border:none;

        border-radius:14px;

        background:linear-gradient(90deg, var(--accent-gold-dim),var(--accent-gold),var(--accent-gold-soft));

        color: var(--text-hi);

        font-size:17px;

        font-weight:600;

        cursor:pointer;

        transition:.35s;

    }

    button:hover{

        transform:translateY(-3px);

        box-shadow:
        0 10px 25px var(--shadow-color),
        0 0 35px var(--overlay-scrim);

    }

    @media(max-width:768px){

        .form-box{

            padding:25px;

        }

    }
    @media (max-width:499px) {
        body{
            padding: 10px;
        }
        .form-box{
            width: 96vw;
            height: 96vh;
            overflow-y: auto;
        }
    }
</style>

</head>
<body>

    <form class="form-box">

    <h2>🎵 Upload New Song</h2>

    <div class="input-group">
    <label>Song Title</label>
    <input type="text" name="title" placeholder="Enter song title" required id="titleInp">
    </div>

    <div class="input-group">
    <label>Artist Name</label>
    <input type="text" name="artist" placeholder="Enter artist name" required id="artistInp">
    </div>

    <div class="input-group">
    <label>Song Image</label>

    <label class="file-box">
    📷 Click to Upload Image
    <input type="file" name="image" id="imageInput" accept="image/*" id required>
    </label>

    <img id="imagePreview" class="preview-img">
    </div>

    <div class="input-group">
    <label>Audio File</label>

    <label class="file-box">
    🎧 Click to Upload Audio
    <input type="file" name="audio" id="audioInput" accept=".mp3,.wav,.ogg">
    </label>

    <audio id="audioPreview" controls></audio>

    </div>

    <button type="submit" id="uploadBtn">
    Upload Song
    </button>

    </form>

    <script type="module" src="./JS/uploadSongForm.js"> </script>

</body>
</html>
