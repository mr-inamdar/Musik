<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon"
          type="image/png"
          href="./images/musik-modified.png">

    <title>Musik - Upload Album</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        @import url('./CSS/theme.css');


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        ::-webkit-scrollbar {
            display: none;
        }


        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;

            background: var(--bg-0);

            overflow-x: hidden;

            position: relative;
        }


        /* =========================
           BACKGROUND
        ========================= */

        body::before,
        body::after {

            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            filter: blur(120px);

            z-index: -1;
        }


        body::before {

            top: -120px;
            left: -120px;

            background: var(--accent-gold-dim);

            opacity: .45;
        }


        body::after {

            bottom: -120px;
            right: -120px;

            background: var(--accent-gold);

            opacity: .35;
        }


        /* =========================
           FORM
        ========================= */

        .form-box {

            width: 100%;

            max-width: 680px;

            padding: 35px;

            background: var(--bg-1);

            border: 1px solid var(--border-soft);

            border-radius: 24px;

            box-shadow:
                0 0 0 1px var(--overlay-scrim),
                0 25px 60px var(--shadow-color);
        }


        .form-box h2 {

            color: var(--text-hi);

            text-align: center;

            margin-bottom: 30px;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: 1px;
        }


        /* =========================
           INPUT
        ========================= */

        .input-group {

            margin-bottom: 22px;
        }


        .input-group > label {

            display: block;

            margin-bottom: 10px;

            color: var(--text-lo);

            font-size: 14px;
        }


        input[type="text"] {

            width: 100%;

            padding: 15px 18px;

            border-radius: 14px;

            border: 1px solid var(--border-soft);

            background: var(--bg-2);

            color: var(--text-hi);

            font-size: 15px;

            transition: .3s;
        }


        input[type="text"]::placeholder {

            color: var(--text-faint);
        }


        input[type="text"]:focus {

            outline: none;

            border-color: var(--accent-gold);

            box-shadow:
                0 0 20px var(--accent-gold-soft);
        }


        /* =========================
           SONG CONTAINER
        ========================= */

        #songsContainer {

            display: flex;

            flex-direction: column;

            gap: 18px;

            margin-top: 10px;
        }


        /* =========================
           SONG CARD
        ========================= */

        .song-item {

            padding: 20px;

            background: var(--bg-2);

            border: 1px solid var(--border-soft);

            border-radius: 18px;

            animation: songOpen .3s ease;

            position: relative;
        }


        @keyframes songOpen {

            from {

                opacity: 0;

                transform:
                    translateY(-15px)
                    scale(.96);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes songClose {

            from {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

            to {

                opacity: 0;

                transform:
                    translateY(-10px)
                    scale(.95);
            }
        }


        /* =========================
           SONG HEADER
        ========================= */

        .song-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }


        .song-number {

            color: var(--text-hi);

            font-size: 15px;

            font-weight: 600;
        }


        .remove-song {

            width: 32px;

            height: 32px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 50%;

            border: 1px solid var(--border-soft);

            background: transparent;

            color: var(--text-lo);

            cursor: pointer;

            font-size: 20px;

            transition: .25s;
        }


        .remove-song:hover {

            background: var(--accent-gold-dim);

            color: var(--text-hi);

            transform: rotate(90deg);
        }


        /* =========================
           SONG TITLE
        ========================= */

        .song-title {

            width: 100%;

            padding: 14px 16px;

            margin-bottom: 12px;

            border-radius: 12px;

            border: 1px solid var(--border-soft);

            background: var(--bg-1);

            color: var(--text-hi);

            font-size: 14px;
        }


        .song-title:focus {

            outline: none;

            border-color: var(--accent-gold);

            box-shadow:
                0 0 15px var(--accent-gold-soft);
        }


        /* =========================
           SONG ARTIST
        ========================= */

        .song-artist {

            width: 100%;

            padding: 14px 16px;

            margin-bottom: 15px;

            border-radius: 12px;

            border: 1px solid var(--border-soft);

            background: var(--bg-1);

            color: var(--text-hi);

            font-size: 14px;
        }


        .song-artist:focus {

            outline: none;

            border-color: var(--accent-gold);

            box-shadow:
                0 0 15px var(--accent-gold-soft);
        }


        /* =========================
           FILE BOX
        ========================= */

        .file-box {

            display: block;

            padding: 16px;

            margin-top: 10px;

            border: 1px dashed var(--border-soft);

            border-radius: 13px;

            text-align: center;

            color: var(--text-faint);

            background: var(--bg-1);

            cursor: pointer;

            font-size: 13px;

            transition: .3s;
        }


        .file-box:hover {

            border-color: var(--accent-gold);

            background: var(--bg-3);
        }


        input[type="file"] {

            display: none;
        }


        /* =========================
           POSTER PREVIEW
        ========================= */

        .poster-preview {

            display: none;

            width: 120px;

            height: 120px;

            object-fit: cover;

            margin: 15px auto 0;

            border-radius: 12px;

            border: 2px solid var(--border-soft);

            box-shadow:
                0 0 20px var(--shadow-color);
        }


        /* =========================
           AUDIO NAME
        ========================= */

        .audio-name {

            display: block;

            margin-top: 10px;

            text-align: center;

            color: var(--text-faint);

            font-size: 12px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =========================
           ADD SONG
        ========================= */

        #addSongBtn {

            width: 100%;

            padding: 14px;

            margin-top: 18px;

            border-radius: 14px;

            border: 1px dashed var(--accent-gold);

            background: transparent;

            color: var(--accent-gold);

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: .3s;
        }


        #addSongBtn:hover {

            background: var(--accent-gold-dim);

            transform: translateY(-2px);
        }


        /* =========================
           UPLOAD ALBUM
        ========================= */

        #uploadAlbumBtn {

            width: 100%;

            padding: 16px;

            margin-top: 22px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    90deg,
                    var(--accent-gold-dim),
                    var(--accent-gold),
                    var(--accent-gold-soft)
                );

            color: var(--text-hi);

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            transition: .35s;
        }


        #uploadAlbumBtn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px var(--shadow-color),
                0 0 35px var(--overlay-scrim);
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 768px) {

            .form-box {

                padding: 25px;
            }
        }


        @media(max-width: 499px) {

            body {

                padding: 10px;
            }


            .form-box {

                width: 96vw;

                height: 96vh;

                overflow-y: auto;
            }
        }

    </style>

</head>


<body>


<form class="form-box" id="albumForm">


    <h2>💿 Upload New Album</h2>


    <!-- =========================
         ALBUM NAME
    ========================= -->

    <div class="input-group">

        <label>Album Name</label>

        <input
            type="text"
            id="albumName"
            name="albumName"
            placeholder="Enter album name"
            required
        >

    </div>


    <!-- =========================
         SONGS
    ========================= -->

    <div class="input-group">

        <label>Album Songs</label>

        <div id="songsContainer"></div>


        <button
            type="button"
            id="addSongBtn"
        >
            ＋ Add Song
        </button>

    </div>


    <!-- =========================
         SUBMIT
    ========================= -->

    <button
        type="submit"
        id="uploadAlbumBtn"
    >
        Upload Album
    </button>


</form>


<script
    type="module"
    src="./JS/uploadAlbumForm.js">
</script>


</body>

</html>
