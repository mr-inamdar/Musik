<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Song</title>

    <link rel="stylesheet" href="./CSS/updateSong.css">
</head>
<body>

<div class="update-container">

    <div class="page-header">
        <h1><i class="bi bi-pencil-square"></i> Update Song</h1>
        <p>Edit your song information</p>
    </div>

    <form class="update-form">

        <div class="cover-section">

            <img
                src="https://placehold.co/250x250"
                id="coverPreview"
                alt="Song Cover">

            <label class="upload-btn">
                <i class="bi bi-image"></i>
                Change Cover
                <input type="file" id="coverInput" accept="image/*" hidden>
            </label>

        </div>

        <div class="form-fields">

            <div class="input-box">
                <label>Song Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter song title">
            </div>

            <div class="input-box">
                <label>Artist</label>
                <input
                    type="text"
                    id="artist"
                    placeholder="Artist name">
            </div>

            <div class="input-box">
                <label>Album</label>
                <input
                    type="text"
                    id="album"
                    placeholder="Album name">
            </div>

            <div class="buttons">

                <button
                    type="button"
                    class="cancel-btn">
                    <i class="bi bi-x-circle"></i>
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn">
                    <i class="bi bi-check-circle"></i>
                    Update Song
                </button>

            </div>

        </div>

    </form>

</div>

<script type="module" src="./JS/updateSong.js"></script>

</body>
</html>
