<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/musik-modified.png">
    <title>Musik - Sign Up</title>

    <style>
        @import url('./CSS/theme.css');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding: 24px;
            background:
                radial-gradient(circle at 12% 8%, rgba(212,175,55,.08), transparent 42%),
                radial-gradient(circle at 88% 92%, rgba(183,110,121,.07), transparent 42%),
                linear-gradient(160deg, var(--bg-0), var(--bg-1));
            position: relative;
            overflow: hidden;
        }

        body::before{
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--border-soft) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
            background-size: 46px 46px;
            opacity: .12;
            pointer-events: none;
        }

        .brand{
            position: absolute;
            top: 34px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--grad-gold);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            z-index: 2;
            animation: cardRise .6s var(--ease) both;
        }

        .container{
            width:400px;
            max-width: 100%;
            background: var(--grad-surface);
            padding:40px 35px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-soft);
            box-shadow: var(--elev-3);
            position: relative;
            z-index: 1;
            animation: cardRise .55s var(--ease-out) both .05s;
        }

        .container h2{
            text-align:center;
            margin-bottom: 6px;
            font-family: var(--font-display);
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--text-hi);
        }

        .subhead{
            text-align: center;
            color: var(--text-lo);
            font-size: .88rem;
            margin-bottom: 30px;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size: .82rem;
            font-weight:700;
            letter-spacing: .3px;
            text-transform: uppercase;
            color: var(--text-lo);
        }

        .input-group input{
            width:100%;
            padding:13px 16px;
            border:1px solid var(--border-soft);
            border-radius: var(--radius-md);
            background: var(--bg-2);
            color: var(--text-hi);
            outline:none;
            font-size:15px;
            transition: var(--t-fast);
        }

        .input-group input::placeholder{
            color: var(--text-faint);
        }

        .input-group input:focus{
            border-color: var(--accent-gold);
            box-shadow:0 0 0 3px rgba(212,175,55,.14);
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius: var(--radius-pill);
            background: var(--grad-gold);
            color: var(--bg-0);
            font-size:16px;
            font-weight: 700;
            letter-spacing: .3px;
            cursor:pointer;
            box-shadow: var(--elev-1);
            transition: transform var(--t-fast), box-shadow var(--t-fast), filter var(--t-fast);
        }

        button:hover{
            transform: translateY(-2px);
            filter: brightness(1.06);
            box-shadow: var(--elev-2), var(--glow-gold);
        }

        button:active{
            transform: translateY(0) scale(.98);
        }

        .login-link{
            text-align:center;
            margin-top:22px;
            color: var(--text-lo);
            font-size: .9rem;
        }

        .login-link a{
            text-decoration:none;
            color: var(--accent-gold-soft);
            font-weight:700;
            transition: color var(--t-fast);
        }

        .login-link a:hover{
            color: var(--accent-rose-soft);
            text-decoration:underline;
        }

        @media(max-width:450px){
            .container{
                width:100%;
                padding: 32px 24px;
            }
            .brand{ top: 20px; font-size: 1.1rem; }
        }

    </style>
</head>
<body>

    <div class="brand">Musik</div>

    <div class="container">

        <h2>Create Account</h2>
        <p class="subhead">Join Musik and start listening.</p>

        <form action="/signup" method="POST" id="signupForm">

            <div class="input-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                    id="nameInp">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    id="emailInp">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    id="passwordInp">
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    required
                    id="confirmPasswordInp">
            </div>

            <button type="submit" id="submitBtn">
                Sign Up
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script src="JS/singup.js"></script>

</body>
</html>
