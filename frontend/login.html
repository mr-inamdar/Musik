<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/musik-modified.png">
    <title>Musik - Login</title>

    <style>
        @import url('./CSS/theme.css');
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg, var(--bg-0), var(--bg-1));
        }

        .container{
            width:380px;
            background: var(--bg-2);
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 35px  var(--shadow-color);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color: var(--text-hi);
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            color: var(--text-lo);
            font-weight:bold;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid var(--border-soft);
            border-radius:8px;
            font-size:16px;
            outline:none;
            transition:.3s;
        }

        .input-group input:focus{
            border-color: var(--accent-gold);
            box-shadow:0 0 8px var(--accent-gold-soft);
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            font-size:14px;
        }

        .options a{
            text-decoration:none;
            color: var(--accent-rose);
        }

        .options a:hover{
            text-decoration:underline;
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:8px;
            background: var(--bg-4);
            color: var(--text-hi);
            font-size:17px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background: var(--bg-5);
        }

        .signup-link{
            text-align:center;
            margin-top:20px;
            color: var(--accent-rose);
        }

        .signup-link a{
            color: var(--accent-rose-soft);
            text-decoration:none;
            font-weight:bold;
        }

        .signup-link a:hover{
            text-decoration:underline;
        }

        @media(max-width:450px){
            .container{
                width:90%;
            }
        }

    </style>
</head>
<body>

    <div class="container">

        <h2>Welcome Back</h2>

        <form action="/login" method="POST" id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    id="emailInp"
                    value="">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    id="passwordInp"
                    value="">
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" id="submitBtn">
                Login
            </button>

        </form>

        <div class="signup-link">
            Don't have an account?
            <a href="singup.html">Create Account</a>
        </div>

    </div>

    <script src="JS/login.js"></script>

</body>
</html>
