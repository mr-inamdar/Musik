<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/musik-modified.png">
    <title>Musik - Sign Up</title>

    <style>
        @import url('./CSS/theme.css');
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg, var(--bg-0), var(--bg-1));
        }

        .container{
            width:380px;
            background: var(--bg-2);
            padding:35px;
            border-radius:15px;
            box-shadow:0 15px 35px  var(--shadow-color);
        }

        .container h2{
            text-align:center;
            margin-bottom:25px;
            color: var(--text-hi);
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:6px;
            font-weight:bold;
            color: var(--text-lo);
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid var(--border-soft);
            border-radius:8px;
            outline:none;
            font-size:16px;
            transition:.3s;
        }

        .input-group input:focus{
            border-color: var(--accent-gold);
            box-shadow:0 0 8px var(--accent-gold-soft);
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:8px;
            background: var(--bg-4);
            color: var(--text-hi);
            font-size:17px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
             background: var(--bg-5);
        }

        .login-link{
            text-align:center;
            margin-top:18px;
        }

        .login-link a{
            text-decoration:none;
            color: var(--accent-rose-soft);
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        @media(max-width:450px){
            .container{
                width:90%;
            }
        }

    </style>
</head>
<body>

    <div class="container">

        <h2>Create Account</h2>

        <form action="/signup" method="POST" id="signupForm">

            <div class="input-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                    id="nameInp">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    id="emailInp">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    id="passwordInp">
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    required
                    id="confirmPasswordInp">
            </div>

            <button type="submit" id="submitBtn">
                Sign Up
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

    <script src="JS/singup.js"></script>

</body>
</html>
