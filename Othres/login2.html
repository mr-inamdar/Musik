<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mixora | Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<div class="background">

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

</div>


<div class="login-container">

    <div class="glass-card">

        <div class="logo">

            <h1>Mixora</h1>

            <p>Feel Every Beat</p>

        </div>


        <form id="loginForm">

            <div class="divider1">

                <h2>Welcome Back</h2>

                <span>
                    Login to continue your music journey
                </span>


                <!-- EMAIL -->

                <div class="input-box">

                    <input
                            type="email"
                            id="email"
                            required
                    >

                    <label>Email Address</label>

                    <i class="ri-mail-line"></i>

                </div>


                <!-- PASSWORD -->

                <div class="input-box">

                    <input
                            type="password"
                            id="password"
                            required
                    >

                    <label>Password</label>

                    <i class="ri-lock-line left-icon"></i>

                    <i
                            class="ri-eye-line toggle-password"
                            id="togglePassword"
                    ></i>

                </div>
            </div>

            <div class="divider2">


                <div class="options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember Me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

            


            

                <button
                        class="login-btn"
                        type="submit">

                    Login

                </button>


                <div class="divider">

                    <span>OR</span>

                </div>



                <div class="social-login">

                    <button
                            type="button"
                            class="google">

                        <i class="ri-google-fill"></i>

                        Google

                    </button>

                    <button
                            type="button"
                            class="github">

                        <i class="ri-github-fill"></i>

                        GitHub

                    </button>

                </div>


                <div class="signup">

                    Don't have an account?

                    <a href="signup.html">

                        Create Account

                    </a>

                </div>

            </div>

        </form>

    </div>

</div>


<script src="login.js"></script>

</body>
</html>
