<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Song — MUSIC2D</title>

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="uploadSongForm.css">
</head>
<body>

    <form class="form-box" id="uploadForm" novalidate>

        <h2>🎵 Upload New Song</h2>
        <p class="form-subtitle">Add a track to your MUSIC2D library</p>

        <div class="input-group">
            <label for="titleInp">Song Title</label>
            <input type="text" name="title" placeholder="Enter song title" required id="titleInp">
        </div>

        <div class="input-group">
            <label for="artistInp">Artist Name</label>
            <input type="text" name="artist" placeholder="Enter artist name" required id="artistInp">
        </div>

        <div class="input-group">
            <label for="albumInp">Album Name</label>
            <input type="text" name="album" placeholder="Enter album name" id="albumInp">
        </div>

        <div class="input-group">
            <label for="imageInput">Song Image</label>

            <label class="file-box" for="imageInput">
                <i class="bi bi-image"></i>
                <span id="imageFileLabel">Click to upload image</span>
            </label>
            <input type="file" name="image" id="imageInput" accept="image/*" required>

            <img id="imagePreview" class="preview-img" alt="Song cover preview">
        </div>

        <div class="input-group">
            <label for="audioInput">Audio File</label>

            <label class="file-box" for="audioInput">
                <i class="bi bi-headphones"></i>
                <span id="audioFileLabel">Click to upload audio</span>
            </label>
            <input type="file" name="audio" id="audioInput" accept=".mp3,.wav,.ogg" required>

            <audio id="audioPreview" controls></audio>
        </div>

        <button type="submit" id="uploadBtn">
            Upload Song
        </button>

    </form>

    <script type="module" src="./JS/uploadSongForm.js"></script>

</body>
</html>
